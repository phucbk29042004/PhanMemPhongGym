<!DOCTYPE html>
<html lang="vi">

<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Đăng nhập - Paradise GYM</title>
    <script src="./assets/js/tailwindcss.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .focus-halo:focus-within {
            box-shadow: rgba(29, 147, 54, 0.16) 0px 0px 0px 4px;
        }

        .button-primary-active:active {
            transform: scale(0.98);
            transition-duration: 200ms;
        }

        .bg-gradient-soft {
            background: linear-gradient(135deg, #f7f9ff 0%, #e8f0fe 100%);
        }

        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-8px);
            }

            50% {
                transform: translateX(8px);
            }

            75% {
                transform: translateX(-8px);
            }
        }

        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#004d2a",
                        "primary-container": "#1D9336",
                        "on-primary": "#ffffff",
                        "surface": "#f7f9ff",
                        "outline-variant": "#bec9bf",
                        "on-surface": "#181c20",
                        "on-surface-variant": "#3f4941",
                        "error": "#ba1a1a",
                        "text-secondary": "#1D9336"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "xl": "1rem",
                        "2xl": "1.5rem"
                    }
                },
            },
        }
    </script>
</head>

                                    <path d="M19,37 C19,31 18,24 20,15" fill="none" stroke="#14532d" stroke-width="3"

    <!-- Scripts -->
    <script>window.GymApp = { data: {}, pages: {} };</script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Standard toast for login page (avoid blocking alert)
        window.GymApp.toast = function (message, type = 'success') {
            const colors = { success: 'background:#1D9336', error: 'background:#ba1a1a', info: 'background:#575f67', warning: 'background:#e65100' };
            const el = document.createElement('div');
            el.style.cssText = `position:fixed;bottom:20px;right:20px;z-index:9999;${colors[type] || colors.info};color:#fff;padding:12px 24px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.3);font-size:14px;font-weight:600;transition:all 0.3s ease;`;
            el.innerHTML = message;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
        };

        // Handle Form Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined text-xl">progress_activity</span><span>Đang xác thực...</span>';

            const success = await window.GymApp.auth.login(username, password);

            if (!success) {
                window.GymApp.toast('Tên đăng nhập hoặc mật khẩu không chính xác. Vui lòng thử lại!', 'error');
                btn.disabled = false;
                btn.innerHTML = originalContent;

                // Visual feedback
                const form = document.getElementById('login-form');
                form.classList.add('animate-shake');
                setTimeout(() => form.classList.remove('animate-shake'), 500);

                // Focus password input for retry
                const passInput = document.getElementById('password');
                passInput.value = '';
                passInput.focus();
            }
        });

        // Toggle visibility (UI only for now)
        const passInput = document.getElementById('password');
        const toggleBtn = passInput.nextElementSibling;
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                toggleBtn.querySelector('span').textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body>
